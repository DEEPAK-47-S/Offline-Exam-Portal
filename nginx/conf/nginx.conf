worker_processes 1;

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    upstream flask_app {
        # least_conn routes every new request to the server with fewest active connections
        least_conn;
        server 127.0.0.1:5001 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:5002 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:5003 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:5004 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:5005 max_fails=3 fail_timeout=5s;
    }

    server {
        # Listen on port 5000 for ALL students & teachers
        listen       5000;
        server_name  _;

        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # WebSocket support for code execution streaming
        location /ws/ {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
